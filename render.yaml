# Render Blueprint — deploy with one click: https://render.com/docs/infrastructure-as-code
services:
  - type: web
    name: samjhao
    runtime: python
    plan: free
    region: singapore          # closest free region to India
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: GRADIO_ANALYTICS_ENABLED
        value: "False"
      - key: FRIEND_NAME
        value: Suyash
      - key: FRIEND_CITY
        value: Prayagraj
      - key: FRIEND_EXAM
        value: JEE
      - key: REPO_URL
        value: https://github.com/Yuser00123/samjhao
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_MODEL
        value: gemma-4-31b-it
      - key: LLM_API_KEY
        sync: false            # set this secret in the Render dashboard, never in git
